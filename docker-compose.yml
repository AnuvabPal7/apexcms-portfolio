# Usage: copy .env.example to .env, set the values, then: docker compose up --build
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: apexcms
      POSTGRES_USER: apexcms
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data

  backend:
    build: ./backend
    depends_on: [db]
    ports: ["8080:8080"]
    environment:
      DB_URL: jdbc:postgresql://db:5432/apexcms
      DB_USERNAME: apexcms
      CM_PASSWORD: ${DB_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      CORS_ORIGINS: http://localhost:3000
      UPLOAD_DIR: /data/uploads
    volumes:
      - uploads:/data/uploads

volumes:
  pgdata:
  uploads:
